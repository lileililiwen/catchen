name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Required merge check (see CONTRIBUTING.md / branch-protection).
  # Dotnet steps no-op until the backend solution scaffold exists
  # (launch-overseas-recipe-membership task 1.1); the job still runs and
  # passes so `build` is a stable required check from day one.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so diff-based tooling (coverage gate) can work.
          fetch-depth: 0

      - name: Locate backend solution
        id: sln
        run: |
          path=$(find . -maxdepth 3 -name '*.sln' -not -path './clients/*' | head -n 1 || true)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.sln.outputs.path != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        if: steps.sln.outputs.path != ''
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: steps.sln.outputs.path != ''
        run: dotnet restore "${{ steps.sln.outputs.path }}"

      - name: NuGet audit
        if: steps.sln.outputs.path != ''
        run: |
          sln="${{ steps.sln.outputs.path }}"
          dotnet list "$sln" package --vulnerable --include-transitive
          if dotnet list "$sln" package --vulnerable --include-transitive | grep -qE '^\s*>\s+\S+\s+[0-9].*\s(High|Critical)\s'; then
            echo "::error::Known high/critical NuGet vulnerabilities found. Upgrade the package or add a dated, owner-signed entry to SECURITY-ACCEPTANCES.md."
            exit 1
          fi

      - name: Format verify
        # Fails on any drift from the .editorconfig (deterministic formatting).
        if: steps.sln.outputs.path != ''
        run: dotnet format "${{ steps.sln.outputs.path }}" --verify-no-changes --no-restore

      - name: Build
        if: steps.sln.outputs.path != ''
        run: dotnet build "${{ steps.sln.outputs.path }}" -c Release --no-restore /warnaserror -bl:build.binlog

      - name: Test (with OpenCover coverage)
        if: steps.sln.outputs.path != ''
        run: >
          dotnet test "${{ steps.sln.outputs.path }}" -c Release --no-build
          --collect:"XPlat Code Coverage" --settings Coverlet.runsettings
          --results-directory TestResults

      - name: Incremental coverage gate
        # Fails when the executable lines added by this PR fall below 80%
        # coverage (test projects, EF migrations, and generated code excluded).
        # Only evaluated on pull requests, where the base ref exists.
        if: github.event_name == 'pull_request' && steps.sln.outputs.path != ''
        run: >
          python3 scripts/check_incremental_coverage.py --base origin/main
          --threshold 0.80
          --reports 'backend/TestResults/**/coverage.opencover.xml'
          --lcov-reports 'clients/**/coverage/lcov.info'

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            TestResults/**/coverage.opencover.xml
            clients/**/coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.binlog
            **/TestResults/
          if-no-files-found: ignore

  # Flutter clients (consumer + ops). No-ops until the client workspace
  # scaffold exists; same pattern as the build job.
  flutter:
    name: flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate client workspaces
        id: ws
        shell: bash
        run: |
          mapfile -t dirs < <(find . -maxdepth 3 -name pubspec.yaml -not -path '*/build/*' -exec dirname {} \; | sort)
          {
            echo "list=$(IFS='|'; echo "${dirs[*]}")"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        if: steps.ws.outputs.list != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Every client workspace (consumer, ops, ...) gets the full local gate
      # sequence; any workspace failure fails the job.
      - name: Pub get, format, analyze, audit, test (per workspace)
        if: steps.ws.outputs.list != ''
        shell: bash
        run: |
          IFS='|' read -ra dirs <<< "${{ steps.ws.outputs.list }}"
          status=0
          for dir in "${dirs[@]}"; do
            echo "### Flutter workspace: $dir"
            (cd "$dir" && flutter pub get) || status=1
            dart format --set-exit-if-changed --output=none "$dir" || status=1
            flutter analyze "$dir" || status=1
            (cd "$dir" && bash "$GITHUB_WORKSPACE/scripts/audit_pub_packages.sh") || status=1
            (cd "$dir" && flutter test --coverage) || status=1
          done
          exit $status
